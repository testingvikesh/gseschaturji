name: Deploy to live server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via cPanel API
        id: cpanel_api
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          REPO_ROOT: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -z "${CPANEL_API_TOKEN}" ] || [ -z "${CPANEL_USER}" ] || [ -z "${CPANEL_HOST}" ] || [ -z "${REPO_ROOT}" ]; then
            echo "use_api=false" >> "$GITHUB_OUTPUT"
            echo "cPanel API secrets not set"
            exit 0
          fi
          BASE="https://${CPANEL_HOST}:2083"
          AUTH="${CPANEL_USER}:${CPANEL_API_TOKEN}"
          echo "Pulling latest from GitHub..."
          curl -fsS -u "${AUTH}" \
            "${BASE}/execute/VersionControl/update" \
            -G \
            --data-urlencode "repository_root=${REPO_ROOT}" \
            --data-urlencode "branch=main"
          echo "Deploying on cPanel..."
          curl -fsS -u "${AUTH}" \
            "${BASE}/execute/VersionControlDeployment/create" \
            -G \
            --data-urlencode "repository_root=${REPO_ROOT}"
          echo "use_api=true" >> "$GITHUB_OUTPUT"

      - name: Deploy via cPanel webhook URL
        id: cpanel_webhook
        if: steps.cpanel_api.outputs.use_api != 'true'
        env:
          CPANEL_DEPLOY_URL: ${{ secrets.CPANEL_DEPLOY_URL }}
        run: |
          if [ -z "${CPANEL_DEPLOY_URL}" ]; then
            echo "use_webhook=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -fsS -X POST "${CPANEL_DEPLOY_URL}"
          echo "use_webhook=true" >> "$GITHUB_OUTPUT"

      - name: Start SSH agent
        if: steps.cpanel_api.outputs.use_api != 'true' && steps.cpanel_webhook.outputs.use_webhook != 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        if: steps.cpanel_api.outputs.use_api != 'true' && steps.cpanel_webhook.outputs.use_webhook != 'true'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT || 22 }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync files to server via SSH
        if: steps.cpanel_api.outputs.use_api != 'true' && steps.cpanel_webhook.outputs.use_webhook != 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -avz --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude 'config.json' \
            --exclude '.env' \
            --exclude '.env.local' \
            --exclude 'public/uploads/' \
            --exclude 'output/' \
            -e "ssh -p ${SSH_PORT} -o BatchMode=yes" \
            ./ "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/"
          ssh -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" "cd '${DEPLOY_PATH}' && bash scripts/deploy-remote.sh"
