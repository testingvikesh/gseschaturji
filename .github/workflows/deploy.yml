name: Deploy to live server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via cPanel webhook
        id: cpanel
        env:
          CPANEL_DEPLOY_URL: ${{ secrets.CPANEL_DEPLOY_URL }}
        run: |
          if [ -z "${CPANEL_DEPLOY_URL}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "CPANEL_DEPLOY_URL not set — trying SSH deploy"
            exit 0
          fi
          echo "Triggering cPanel pull + deploy..."
          curl -fsS -X POST "${CPANEL_DEPLOY_URL}"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Start SSH agent
        if: steps.cpanel.outputs.skip != 'false'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        if: steps.cpanel.outputs.skip != 'false'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT || 22 }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        if: steps.cpanel.outputs.skip != 'false'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          ssh -p "${SSH_PORT}" -o BatchMode=yes "${SSH_USER}@${SSH_HOST}" "echo connected && pwd"

      - name: Sync files to server
        if: steps.cpanel.outputs.skip != 'false'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -avz --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude 'config.json' \
            --exclude '.env' \
            --exclude '.env.local' \
            --exclude 'public/uploads/' \
            --exclude 'output/' \
            -e "ssh -p ${SSH_PORT} -o BatchMode=yes" \
            ./ "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/"

      - name: Run post-deploy tasks
        if: steps.cpanel.outputs.skip != 'false'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" "cd '${DEPLOY_PATH}' && bash scripts/deploy-remote.sh"
